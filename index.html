<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аренда кемпинга</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 20px 0;
      background-color: #30a14e;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #228c3a;
    }
    #reader {
      margin-top: 20px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h1>Аренда кемпинга</h1>
  <button onclick="pay()">💳 Оплатить 500 ₽</button>

  <h2 style="margin-top: 40px;">Или отсканируйте QR-код:</h2>
  <div id="reader"></div>
  <p id="result"></p>

  <script>
    Telegram.WebApp.ready();

    function pay() {
      const payUrl = "https://yoomoney.ru/quickpay/shop-widget?writer=seller&targets=Аренда+кемпинга&default-sum=500&button-text=11&payment-type-choice=on&account=4100119123765834";
      window.open(payUrl, "_blank");
    }

    async function startScanner() {
      const devices = await Html5Qrcode.getCameras();
      if (!devices || devices.length === 0) {
        alert("Камеры не найдены");
        return;
      }

      const backCamera = devices.find(d =>
        d.label.toLowerCase().includes("back") ||
        d.label.toLowerCase().includes("rear") ||
        d.label.toLowerCase().includes("environment")
      ) || devices[0];

      const qr = new Html5Qrcode("reader");

      qr.start(
        backCamera.id,
        { fps: 10, qrbox: 250 },
        decodedText => {
          document.getElementById("result").innerText = "📦 QR найден: " + decodedText;
          window.open(decodedText, "_blank");
          qr.stop();
        },
        error => {
          // Ошибки сканирования можно логировать
        }
      );
    }

    startScanner();
  </script>
</body>
</html>
