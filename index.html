<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аренда кемпинга</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    button, select {
      font-size: 18px;
      padding: 12px 24px;
      margin: 10px 0;
      background-color: #30a14e;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #reader {
      margin-top: 20px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h1>Аренда кемпинга</h1>

  <button onclick="pay()">💳 Оплатить 500 ₽</button>

  <h2>Выберите камеру:</h2>
  <select id="camera-select"></select>
  <button onclick="startScanner()">📷 Включить сканер</button>

  <div id="reader"></div>
  <p id="result"></p>

  <script>
    Telegram.WebApp.ready();

    function pay() {
      const payUrl = "https://yoomoney.ru/quickpay/shop-widget?writer=seller&targets=Аренда+кемпинга&default-sum=500&button-text=11&payment-type-choice=on&account=4100119123765834";
      window.open(payUrl, "_blank");
    }

    let html5Qr;

    async function loadCameras() {
      const devices = await Html5Qrcode.getCameras();
      const select = document.getElementById("camera-select");
      devices.forEach(device => {
        const option = document.createElement("option");
        option.value = device.id;
        option.text = device.label || `Камера ${select.length + 1}`;
        select.appendChild(option);
      });
    }

    async function startScanner() {
      const cameraId = document.getElementById("camera-select").value;
      html5Qr = new Html5Qrcode("reader");
      await html5Qr.start(
        cameraId,
        { fps: 10, qrbox: 250 },
        decodedText => {
          document.getElementById("result").innerText = "📦 QR найден: " + decodedText;
          window.open(decodedText, "_blank");
          html5Qr.stop();
        },
        error => {}
      );
    }

    loadCameras(); // загрузим список камер при загрузке страницы
  </script>
</body>
</html>
