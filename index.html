<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Оплата услуг</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 10px;
      background-color: #30a14e;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #228c3a;
    }
  </style>
</head>
<body>
  <h1>Оплата услуг</h1>

  <button id="pay-btn" onclick="pay()">💳 Оплатить</button>
  <button onclick="reload()">🔄 Обновить WebApp</button>

  <script>
    Telegram.WebApp.ready();

    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get("amount") || "500";

    // Обновление текста кнопки при загрузке
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("pay-btn");
      if (btn) {
        btn.textContent = `💳 Оплатить ${amount} ₽`;
      }
    });

    // Переход к оплате
    function pay() {
      const payUrl = `https://yoomoney.ru/quickpay/shop-widget?writer=seller&targets=Оплата+услуг&default-sum=${amount}&button-text=11&payment-type-choice=on&account=4100119123765834`;
      window.open(payUrl, "_blank");
    }

    // Обновление WebApp вручную
    function reload() {
      location.reload();
    }
  </script>
</body>
</html>
