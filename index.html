<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Оплаты вашей темки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
      background-color: #f2f2f2;
    }
    h1 {
      margin-bottom: 20px;
    }
    button {
      font-size: 18px;
      padding: 15px 25px;
      background-color: #30a14e;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #228c3a;
    }
  </style>
</head>
<body>
  <h1>Аренда кемпинга</h1>
  <p>Нажми кнопку ниже, чтобы перейти к оплате:</p>
  <button onclick="pay()">💳 Оплатить 500 ₽</button>

  <script>
    Telegram.WebApp.ready();

    function pay() {
      // Вставь сюда свою ссылку на оплату (например, от YooMoney)
      const payUrl = "https://yoomoney.ru/quickpay/shop-widget?writer=seller&targets=Аренда+кемпинга&default-sum=500&button-text=11&payment-type-choice=on&account=4100119123765834";
      window.open(payUrl, "_blank");
      Telegram.WebApp.close(); // Закроет WebApp после нажатия
    }
  </script>
</body>
</html>
