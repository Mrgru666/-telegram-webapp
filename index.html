<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Оплата услуг</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 10px;
      background-color: #30a14e;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #reader {
      margin-top: 20px;
      width: 300px;
      margin: 20px auto;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Оплата услуг</h1>

  <button id="pay-btn">💳 Оплатить</button>
  <button onclick="reload()">🔄 Обновить WebApp</button>
  <button id="qr-btn">📸 Оплатить по QR</button>
  <select id="camera-select" style="display:none;"></select>
  <button id="start-scan" style="display:none;">▶️ Начать сканирование</button>

  <div id="reader"></div>
  <p id="result"></p>

  <script>
    Telegram.WebApp.ready();

    let amount = "500";
    let qrInstance;

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      amount = params.get("amount") || "500";

      const payBtn = document.getElementById("pay-btn");
      payBtn.textContent = `💳 Оплатить ${amount} ₽`;
      payBtn.onclick = pay;
    });

    function pay() {
      const payUrl = `https://yoomoney.ru/quickpay/shop-widget?writer=seller&targets=Оплата+услуг&default-sum=${amount}&button-text=11&payment-type-choice=on&account=4100119123765834`;
      window.open(payUrl, "_blank");
    }

    function reload() {
      location.reload();
    }

    let qrInstance;

  document.getElementById("qr-btn").onclick = async () => {
    const select = document.getElementById("camera-select");
    const startBtn = document.getElementById("start-scan");

  const devices = await Html5Qrcode.getCameras();
  if (!devices || devices.length === 0) {
    alert("Камера не найдена");
    return;
  }

  // Очистить список, если был
  select.innerHTML = "";

  devices.forEach(device => {
    const option = document.createElement("option");
    option.value = device.id;
    option.text = device.label || `Камера ${select.length + 1}`;
    select.appendChild(option);
  });

  select.style.display = "inline-block";
  startBtn.style.display = "inline-block";
};

  document.getElementById("start-scan").onclick = async () => {
    const selectedCamId = document.getElementById("camera-select").value;
    const reader = document.getElementById("reader");
    reader.style.display = "block";

  qrInstance = new Html5Qrcode("reader");

  await qrInstance.start(
    selectedCamId,
    { fps: 10, qrbox: 250 },
    decodedText => {
      document.getElementById("result").innerText = "📦 QR найден: " + decodedText;
      window.open(decodedText, "_blank");
      qrInstance.stop();
    },
    error => {}
  );
};
    }
  </script>
</body>
</html>
