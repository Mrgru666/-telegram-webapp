<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аренда кемпинга</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f2f2f2;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 20px 0;
      background-color: #30a14e;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #21843d;
    }
    #reader {
      margin-top: 20px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h1>Аренда кемпинга</h1>

  <button onclick="pay()">💳 Оплатить 500 ₽</button>

  <h2>Или отсканируйте QR-код:</h2>
  <div id="reader"></div>
  <p id="scan-result"></p>

  <script>
    Telegram.WebApp.ready();

    function pay() {
      const payUrl = "https://yoomoney.ru/quickpay/shop-widget?writer=seller&targets=Аренда+кемпинга&default-sum=500&button-text=11&payment-type-choice=on&account=4100119123765834";
      window.open(payUrl, "_blank");
      // Telegram.WebApp.close(); // можешь вернуть, если нужно закрытие
    }

    async function startScanner() {
      const devices = await Html5Qrcode.getCameras();
      if (devices && devices.length > 0) {
        const backCam = devices.find(d => d.label.toLowerCase().includes("back")) || devices[0];
        const html5Qr = new Html5Qrcode("reader");

        html5Qr.start(
          backCam.id,
          { fps: 10, qrbox: 250 },
          (decodedText, decodedResult) => {
            document.getElementById("scan-result").innerText = "📦 QR найден: " + decodedText;
            window.open(decodedText, "_blank");
            html5Qr.stop();
          },
          errorMessage => {
            // Можно логировать ошибки при сканировании
          }
        );
      } else {
        alert("Камера не найдена");
      }
    }

    startScanner();
  </script>
</body>
</html>
